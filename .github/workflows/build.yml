name: build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: umbrella-dist
          path: |
            dist/
            docs/soporte-por-agente.md
